<!DOCTYPE html>
<!--HireHub Recruitment Website
Page: apply.html - Job Application Form

Contribution note for individual assessment:
- Fields 1-6 (Job Reference Number, First Name, Last Name, Date of Birth, Gender, Street Adress) developed by Priyankha Sakthivel
- Fields 7-13 (Suburb/Town, State, Postcode, Email, Phone, Skills, Other Skills) developed by Kevin Tan-->

<html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta name="description" content="Job application form for tourism and travel industry professionals">
      <!--I want to edit keywords for this page-->
      <meta name="keywords" content="HTML, Form, tags">
      <meta name="author" content="Priyankha Sakthivel, Kevin Tan">
      <title>HireHub Job Application Page</title>
      <link rel="stylesheet" href="styles.css">

    </head>

    <body>
        <header id="top">
            <p>
                <a href="index.html"> <img src="Logo.png" width="100" alt="HireHub Logo"></a>
            </p>
            <h1>Job Application Page</h1>
        </header>

        <p>Please fill out the form below to apply for a position via our company.</p>
        <p><strong>All fields marked with an asterisk (*) are required.</strong></p>

    <form method="post" action="https://mercury.swin.edu.au/it000000/formtest.php">
         <p>
            <label for="jobRef">Job Reference Number *</label>
            <input type="text" id="jobRef" name="jobRef" pattern="[A-Za-z0-9]{6}" required title="Please enter a valid job reference number">
        </p>

        <fieldset>
            <legend>Personal Information</legend>
       
            <p>
                <label for="firstName">First Name *</label>
                <input type="text" id="firstName" name="firstName" pattern="[A-Za-z]{1,20}" title="Please enter a valid first name" required>
            </p>

            <p>
                <label for="lastName">Last Name *</label>
                <input type="text" id="lastName" name="lastName" pattern="[A-Za-z]{1,20}" title="Please enter a valid last name" required>
            </p>

            <p>
                <label for="dob">Date of Birth *</label>
                <input type="text" id="dob" name="dob" placeholder="dd/mm/yyyy" pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}" title="Please enter a valid date of birth" required>
            </p>
            
            <p>
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" title="Please enter your email" required></input>
            </p>

            <p>
                <label for="phoneNum">Phone Number *</label>
                <input type="text" id="phoneNum" name="phoneNum" pattern="[0-9]{8,12}" maxlength="12" title="Please enter your phone number" required>
            </p>
            <p>
        </fieldset>

        <fieldset>
            <legend>Gender *</legend>
            <p>
                <label for="gender1">Male</label>
                <input type="radio" id="gender1" name="gender" required>
                 
                <label for="gender2">Female</label>
                <input type="radio" id="gender2" name="gender">

                <label for="gender3">Other</label>
                <input type="radio" id="gender3" name="gender">

                <label for="gender4">Prefer not to say</label>
                <input type="radio" id="gender4" name="gender">
            </p>
        </fieldset>
         
        <fieldset>
            <legend>Address</legend>
            <p>
            <label for="streetAddress">Street Address *</label>
            <input type="text" id="streetAddress" name="streetAddress" pattern="[A-Za-z0-9]{2,40}" title="Please enter a valid street address" required>
            </p>
            <p>
              <label for="suburb">Suburb *</label>
              <input type="text" id="suburb" name="suburb" pattern="[A-Za-z0-9]{2,40}" title="Please enter a valid suburb" required>
            </p>
            <p>
              <label for="state">State *</label>
              <select id="state" name="state">
                <option value="VIC"> VIC </option>
                <option value="NSW"> NSW </option>
                <option value="QLD"> QLD </option>
                <option value="NT"> NT </option>
                <option value="WA"> WA </option>
                <option value="SA"> SA </option>
                <option value="TAS"> TAS </option>
                <option value="ACT"> ACT </option>
              </select>
            </p>
            <p>
              <label for="postcode">Postcode * </label>
              <input type="text" id="postcode" name="postcode" pattern="[0-9]{4}" maxlength="4" required>
            </p>
        </fieldset>

       <fieldset>
        <legend> Skills </legend>

        <p>
            <label for="html">Skill1</label> 
        <input type="checkbox" id="skill1" name="category[]" value="skill1" checked="checked">
        <label for="css">Skill2</label> 
        <input type="checkbox" id="skill2" name="category[]" value="skill2">
        <label for="javascript">Skill3</label> 
        <input type="checkbox" id="skill3" name="category[]" value="skill3">
        <label for="php">skill4</label> 
        <input type="checkbox" id="skill4" name="category[]" value="skill4">
        <label for="mysql">skill5</label> 
        <input type="checkbox" id="skill5" name="category[]" value="skill5">
      </p>

       <textarea rows="4" cols="40" placeholder="Write about your skills here..."></textarea>
      </fieldset>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset Form">
      
    </form>
    </body>
</html>
